<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
    <title>Color Scheme Generator</title>
  </head>
  <body>
    <div class="container">
      <div class="color-select">
        <input
          type="color"
          id="base-color"
          name="base-color"
          value="#f55a5a"
          aria-label="base color"
        />

        <div class="select" id="scheme-select">
          <span class="sr-only" id="scheme-label">Color scheme mode</span>
          <button
            type="button"
            class="select-trigger"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-labelledby="scheme-label scheme-value"
          >
            <span id="scheme-value">Monochrome</span>
            <span class="select-arrow" aria-hidden="true"></span>
          </button>
          <ul class="select-options" role="listbox" tabindex="-1">
            <li
              id="scheme-option-0"
              role="option"
              data-value="monochrome"
              aria-selected="true"
            >
              Monochrome
            </li>
            <li id="scheme-option-1" role="option" data-value="monochrome-dark">
              Monochrome Dark
            </li>
            <li
              id="scheme-option-2"
              role="option"
              data-value="monochrome-light"
            >
              Monochrome Light
            </li>
            <li id="scheme-option-3" role="option" data-value="analogic">
              Analogic
            </li>
            <li id="scheme-option-4" role="option" data-value="complement">
              Complement
            </li>
            <li
              id="scheme-option-5"
              role="option"
              data-value="analogic-complement"
            >
              Analogic Complement
            </li>
            <li id="scheme-option-6" role="option" data-value="triad">Triad</li>
            <li id="scheme-option-7" role="option" data-value="quad">Quad</li>
          </ul>
          <input
            type="hidden"
            id="scheme-mode"
            name="scheme-mode"
            value="monochrome"
          />
        </div>
        <button id="generate-scheme">Get color scheme</button>
      </div>
      <div class="colors">
        <div class="color-0"></div>
        <div class="color-1"></div>
        <div class="color-2"></div>
        <div class="color-3"></div>
        <div class="color-4"></div>
      </div>
      <div class="hex-codes">
        <div class="hex-code">#F55A5A</div>
        <div class="hex-code">#2B283A</div>
        <div class="hex-code">#FBF3AB</div>
        <div class="hex-code">#AAD1B6</div>
        <div class="hex-code">#A626D3</div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
