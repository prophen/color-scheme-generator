<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
    <title>Color Scheme Generator</title>
  </head>
  <body>
    <div class="container">
      <div class="color-select">
        <input
          type="color"
          id="base-color"
          name="base-color"
          value="#f55a5a"
          aria-label="base color"
        />

        <select
          id="scheme-mode"
          name="scheme-mode"
          aria-label="color scheme mode"
        >
          <option value="monochrome">Monochrome</option>
          <option value="monochrome-dark">Monochrome Dark</option>
          <option value="monochrome-light">Monochrome Light</option>
          <option value="analogic">Analogic</option>
          <option value="complement">Complement</option>
          <option value="analogic-complement">Analogic Complement</option>
          <option value="triad">Triad</option>
          <option value="quad">Quad</option>
        </select>
        <button id="generate-scheme">Get color scheme</button>
      </div>
      <div class="colors">
        <div class="color-1"></div>
        <div class="color-2"></div>
        <div class="color-3"></div>
        <div class="color-4"></div>
        <div class="color-5"></div>
      </div>
      <div class="hex-codes">
        <div class="hex-code">#F55A5A</div>
        <div class="hex-code">#2B283A</div>
        <div class="hex-code">#FBF3AB</div>
        <div class="hex-code">#AAD1B6</div>
        <div class="hex-code">#A626D3</div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
